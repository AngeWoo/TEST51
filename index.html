<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人才招募系統 | Career Application</title>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <style>
    :root { --primary: #1a365d; --accent: #2b6cb0; --bg: #f7fafc; --text: #2d3748; }
    body { font-family: "Noto Sans TC", sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); line-height: 1.5; }
    
    .container { max-width: 900px; margin: 10px auto; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
    
    /* Header 樣式 */
    .header { background: var(--primary); color: white; padding: 40px 20px; text-align: center; position: relative; }
    .header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; word-break: keep-all; }
    
    /* 管理後台按鈕 */
    .admin-btn { 
      position: absolute; top: 10px; right: 10px; 
      color: rgba(255,255,255,0.8); font-size: 11px; text-decoration: none; 
      border: 1px solid rgba(255,255,255,0.4); padding: 4px 10px; border-radius: 20px;
      transition: all 0.3s;
    }

    .content { padding: 30px; }
    
    /* 步驟指示器 */
    .stepper { display: flex; justify-content: space-between; padding: 15px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    .step-idx { color: #cbd5e0; font-weight: bold; }
    .step-idx.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

    .step { display: none; animation: fadeIn 0.4s ease; }
    .step.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

    /* 表單佈局 */
    .section-title { font-size: 18px; color: var(--primary); border-left: 4px solid var(--accent); padding-left: 10px; margin: 25px 0 15px; grid-column: span 2; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .full { grid-column: span 2; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; }
    input:focus { border-color: var(--accent); outline: none; }
    
    /* 簽名版樣式 */
    .canvas-container { width: 100%; background: #fdfdfd; border: 1px dashed #cbd5e0; border-radius: 8px; margin: 15px 0; touch-action: none; }
    canvas { width: 100%; height: 200px; cursor: crosshair; display: block; }

    /* 測驗題目樣式 */
    .q-card { background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .opt-label { display: flex; align-items: center; justify-content: flex-start; padding: 12px 15px; margin: 8px 0; background: white; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; }
    .opt-label input { width: auto; margin: 0 15px 0 0; }

    .btn-next { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; margin-top: 15px; }

    /* --- 手機版優化 (Mobile Optimization) --- */
    @media (max-width: 600px) {
      .header { padding: 30px 15px; }
      .header h1 { font-size: 22px; }
      .content { padding: 20px 15px; }
      
      /* 核心修復：手機端由雙欄改為單欄，避免重疊 */
      .grid { grid-template-columns: 1fr; gap: 15px; }
      .section-title { grid-column: span 1; font-size: 16px; }
      .full { grid-column: span 1; }
      
      .stepper { font-size: 11px; padding: 10px 5px; }
      input, select, textarea { padding: 10px; font-size: 14px; }
      
      .admin-btn { top: 5px; right: 5px; font-size: 10px; padding: 2px 8px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="admin.html" class="admin-btn">管理登入</a>
    <h1>炎洲集團人才面試E化系統</h1>
  </div>

  <div class="stepper">
    <div id="s1" class="step-idx active">1. 填寫履歷</div>
    <div id="s2" class="step-idx">2. 簽署文件</div>
    <div id="s3" class="step-idx">3. 專業測驗</div>
    <div id="s4" class="step-idx">4. 申請完成</div>
  </div>

  <div class="content">
    <!-- Step 1: 履歷填寫 -->
    <div id="step1" class="step active">
      <form id="resumeForm" class="grid">
        <div class="section-title">個人基本資料</div>
        <div class="input-group"><label>姓名 *</label><input type="text" name="name" placeholder="請輸入姓名" required></div>
        <div class="input-group"><label>性別</label><select name="gender"><option>男</option><option>女</option></select></div>
        <div class="input-group"><label>出生日期 *</label><input type="date" name="birthday" required></div>
        <div class="input-group"><label>電話 *</label><input type="tel" name="phone" placeholder="例：0912345678" required></div>
        <div class="input-group full"><label>電子郵件 *</label><input type="email" name="email" placeholder="example@mail.com" required></div>
        <div class="input-group full"><label>通訊地址</label><input type="text" name="address" placeholder="請輸入聯繫地址"></div>

        <div class="section-title">專業背景與需求</div>
        <div class="input-group"><label>最高學歷</label><input type="text" name="edu" placeholder="例：大學"></div>
        <div class="input-group"><label>畢業學校</label><input type="text" name="school"></div>
        <div class="input-group"><label>科系名稱</label><input type="text" name="major"></div>
        <div class="input-group"><label>工作年資 (年)</label><input type="number" name="expYears" value="0"></div>
        <div class="input-group"><label>應徵職務 *</label><input type="text" name="job" required></div>
        <div class="input-group">
          <label>需求單位 *</label>
          <select name="dept" required>
            <option value="">請選擇單位</option>
            <option>行政部</option><option>技術開發部</option><option>行銷部</option>
            <option>業務部</option><option>研發部</option><option>財務部</option>
          </select>
        </div>
        <div class="input-group full"><label>工作經歷簡述</label><textarea name="expDetail" rows="3" placeholder="請簡述過去工作內容"></textarea></div>
        <div class="input-group full"><label>專長技能</label><input type="text" name="skills" placeholder="例：Excel, Python, 專案管理"></div>
        <div class="input-group full"><label>自我介紹</label><textarea name="intro" rows="4" placeholder="請簡單介紹您的優勢"></textarea></div>
      </form>
      <button class="btn-next" onclick="submitStep1()">下一步：簽署聲明文件</button>
    </div>

    <!-- Step 2: 簽名 -->
    <div id="step2" class="step">
      <h3 style="text-align:center;">應徵者個人資料蒐集同意書</h3>
      <div style="background:#f8fafc; padding:15px; font-size:13px; color:#64748b; border-radius:8px; line-height:1.6; margin-bottom:15px;">
        本人同意貴公司基於招募、評估之目的蒐集、處理及利用本人之個人資料。本人保證以上提供之資訊均為屬實。
      </div>
      <label>請於下方區域完成手寫簽名：</label>
      <div class="canvas-container">
        <canvas id="sig-pad"></canvas>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button onclick="sig.clear()" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; background:white; cursor:pointer;">清除</button>
        <button onclick="submitStep2()" class="btn-next" style="flex:2; margin-top:0;">確認簽署</button>
      </div>
    </div>

    <!-- Step 3: 測驗 -->
    <div id="step3" class="step">
      <h3 style="text-align:center;">專業適性評測</h3>
      <p style="color:#718096; text-align:center; font-size:14px; margin-bottom:25px;">請選出最符合您的選項</p>
      <div id="examContainer"></div>
      <button class="btn-next" id="submitBtn" onclick="handleFinalSubmit()">提交所有應徵資料</button>
    </div>

    <!-- Step 4: 完成 -->
    <div id="step4" class="step" style="text-align:center; padding: 50px 0;">
      <div style="font-size: 65px; color:#48bb78;">✓</div>
      <h2 style="color:var(--primary)">申請提交完成</h2>
      <div style="margin: 20px 0;">
        <p style="color:#718096; margin-bottom:5px;">您的測驗得分</p>
        <span id="scoreDisplay" style="font-size:48px; font-weight:bold; color:var(--accent);">0</span>
      </div>
      <p style="color:#718096; font-size:14px;">感謝參與，我們將在初步篩選後主動連繫您。</p>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyQowSQ7CyUi44l5b3QXbkiEylN1TOeTUIxtirDOnbh1qbXH1YnZ3v0ylq2-kjsXQjxCQ/exec";
  let sig, applicantName = "";

  window.onload = () => {
    const canvas = document.getElementById('sig-pad');
    sig = new SignaturePad(canvas);
  };

  function resizeCanvas() {
    const canvas = document.getElementById('sig-pad');
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    canvas.getContext("2d").scale(ratio, ratio);
    sig.clear();
  }

  async function apiFetch(payload, useGet = false) {
    let url = GAS_URL;
    const options = { method: useGet ? 'GET' : 'POST', mode: 'cors', redirect: 'follow' };
    if (useGet) { url += "?" + new URLSearchParams(payload).toString(); }
    else { options.body = JSON.stringify(payload); }
    const response = await fetch(url, options);
    return await response.json();
  }

  async function submitStep1() {
    const form = document.getElementById('resumeForm');
    if(!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form));
    applicantName = data.name;

    showStep(2);
    setTimeout(resizeCanvas, 150); // 確保在顯示後計算尺寸
    await apiFetch({ action: 'submitResume', resumeData: JSON.stringify(data) });
  }

  async function submitStep2() {
    if(sig.isEmpty()) return alert("請完成手寫簽名");
    const sigData = sig.toDataURL();
    showStep(3);
    const res = await apiFetch({ action: 'getQuestions' }, true);
    
    document.getElementById('examContainer').innerHTML = res.data.map((q, idx) => `
      <div class="q-card">
        <p style="font-weight:bold;">Q${idx+1}. ${q.question}</p>
        ${q.options.map((opt, i) => !opt ? '' : `
          <label class="opt-label">
            <input type="radio" name="q${q.id}" value="${i+1}" required>
            <span>${i+1}. ${opt}</span>
          </label>
        `).join('')}
      </div>`).join('');
    
    await apiFetch({ action: 'submitConsent', userName: applicantName, signatureData: sigData });
  }

  async function handleFinalSubmit() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerText = "資料處理中...";
    
    const answers = {};
    const radios = document.querySelectorAll('#examContainer input:checked');
    if(radios.length === 0) {
      btn.disabled = false;
      return alert("請回答所有測驗題目");
    }
    radios.forEach(r => answers[r.name.replace('q','')] = r.value);

    const finalRes = await apiFetch({ 
      action: 'submitAnswers', 
      userName: applicantName, 
      answers: JSON.stringify(answers) 
    });
    
    document.getElementById('scoreDisplay').innerText = finalRes.score;
    showStep(4);
  }

  function showStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.step-idx').forEach((s, i) => s.classList.toggle('active', i+1 === n));
    document.getElementById('step'+n).classList.add('active');
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
