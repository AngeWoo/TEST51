<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招募數據決策中心 | HR Analytics Admin</title>
  <!-- 引入 Chart.js 用於報表分析 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --primary: #1a365d; --accent: #2b6cb0; --bg: #f0f2f5; --success: #38a169; --warning: #ed8936; --danger: #e53e3e; }
    body { font-family: "Noto Sans TC", "Segoe UI", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #2d3748; }
    .dashboard { max-width: 1400px; margin: auto; }
    
    /* --- 登入畫面優化 (加大版) --- */
    #loginArea { 
      display: flex; justify-content: center; align-items: center; 
      min-height: 80vh; padding: 20px; 
    }
    .login-card { 
      background: white; padding: 50px 40px; border-radius: 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
      width: 100%; max-width: 450px; text-align: center;
    }
    .login-card h2 { margin-bottom: 30px; font-size: 32px; color: var(--primary); font-weight: 800; }
    .login-card input[type="password"] { 
      width: 100%; height: 60px; padding: 15px; margin-bottom: 25px; 
      border: 2px solid #e2e8f0; border-radius: 12px; font-size: 18px; 
      box-sizing: border-box; transition: 0.3s;
    }
    .login-card input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px rgba(43, 108, 176, 0.1); }
    .login-card button { 
      width: 100%; height: 60px; background: var(--accent); color: white; 
      border: none; border-radius: 12px; font-size: 20px; font-weight: bold; 
      cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(43, 108, 176, 0.3);
    }
    .login-card button:hover { background: var(--primary); transform: translateY(-2px); }
    .login-card .back-home { margin-top: 25px; display: block; color: var(--accent); text-decoration: none; font-size: 16px; font-weight: 500; }

    /* 手機版登入區域適配 */
    @media (max-width: 600px) {
      #loginArea { min-height: 70vh; }
      .login-card { padding: 40px 25px; max-width: 95%; }
      .login-card h2 { font-size: 26px; }
    }

    /* --- 主儀表板樣式 --- */
    .header { background: white; padding: 20px 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .btn-nav { padding: 8px 18px; border-radius: 6px; border: 1px solid #e2e8f0; background: white; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none; color: #4a5568; transition: 0.2s; }
    
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 5px solid var(--accent); }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); }

    .toolbar { background: white; padding: 20px; border-radius: 12px; display: flex; gap: 15px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); align-items: center; flex-wrap: wrap; }
    input, select { padding: 10px 15px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    
    .content-box { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 25px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; padding: 15px; text-align: left; border-bottom: 2px solid #e2e8f0; font-size: 13px; color: #4a5568; cursor: pointer; user-select: none; }
    td { padding: 15px; border-bottom: 1px solid #edf2f7; font-size: 14px; }
    .badge { padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }

    .report-section { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 25px; }
    .report-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 850px; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; border: none; background: none; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
    .detail-label { font-size: 11px; color: #718096; font-weight: bold; }
    .detail-val { font-size: 15px; color: #2d3748; }
    .full-row { grid-column: span 3; background: #f8fafc; padding: 12px; border-radius: 6px; }

    @media (max-width: 600px) {
      .detail-grid { grid-template-columns: 1fr 1fr; }
      .toolbar select, .toolbar input { flex: 1 1 100% !important; }
    }
  </style>
</head>
<body>

<!-- 登入區域 -->
<div id="loginArea">
  <div class="login-card">
    <h2>管理授權登入</h2>
    <input type="password" id="pw" placeholder="請輸入管理密碼" onkeypress="if(event.keyCode==13) loadData()">
    <button onclick="loadData()">進入招募決策中心</button>
    <a href="index.html" class="back-home">返回應徵頁面</a>
  </div>
</div>

<div id="mainUI" class="dashboard" style="display:none;">
  <div class="header">
    <div>
      <h2 style="margin:0; color:var(--primary);">招募數據決策儀表板</h2>
      <p style="color:var(--gray); margin:0; font-size:12px;">台北時區數據顯示 • 每頁 201 筆</p>
    </div>
    <div class="nav-group">
      <a href="index.html" class="btn-nav">回應徵首頁</a>
      <button class="btn-nav" style="color:var(--danger)" onclick="location.reload()">登出系統</button>
    </div>
  </div>
  
  <!-- 統計卡片 -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">📊 總應徵人數</div>
      <div id="s-total" class="stat-value">0</div>
    </div>
    <div class="stat-card" style="border-top-color: var(--success);">
      <div class="stat-label">📈 平均測驗得分</div>
      <div id="s-avg" class="stat-value">0</div>
    </div>
    <div class="stat-card" style="border-top-color: var(--warning);">
      <div class="stat-label">📅 今日新增</div>
      <div id="s-today" class="stat-value">0</div>
    </div>
    <div class="stat-card" style="border-top-color: #6b46c1;">
      <div class="stat-label">🏆 最高得分</div>
      <div id="s-max" class="stat-value">0</div>
    </div>
    <div class="stat-card" style="border-top-color: #319795;">
      <div class="stat-label">✅ 及格率 (60+)</div>
      <div id="s-pass" class="stat-value">0%</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchName" placeholder="搜尋姓名關鍵字..." oninput="handleSearch()" style="flex:1.5;">
    <select id="filterDept" onchange="handleSearch()" style="flex:1;"><option value="">所有需求單位</option></select>
    <select id="filterPos" onchange="handleSearch()" style="flex:1;"><option value="">所有應徵職務</option></select>
  </div>

  <div class="content-box">
    <table>
      <thead>
        <tr>
          <th onclick="triggerSort('originalIndex')">NO <span id="icon-originalIndex"></span></th>
          <th onclick="triggerSort('name')">候選人 <span id="icon-name"></span></th>
          <th onclick="triggerSort('dept')">需求單位 <span id="icon-dept"></span></th>
          <th onclick="triggerSort('position')">應徵職務 <span id="icon-position"></span></th>
          <th onclick="triggerSort('score')">分數 <span id="icon-score"></span></th>
          <th onclick="triggerSort('timestamp')">時間 <span id="icon-timestamp"></span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pagination">
      <button class="page-btn" id="prevPage" onclick="changePage(-1)">上一頁</button>
      <span id="pageInfo" style="font-size:14px; color:var(--gray);">第 1 / 1 頁</span>
      <button class="page-btn" id="nextPage" onclick="changePage(1)">下一頁</button>
    </div>
  </div>

  <!-- 分析報表區 -->
  <div class="report-section">
    <div class="report-card">
      <div style="font-weight:bold; margin-bottom:15px; border-left:4px solid var(--accent); padding-left:10px;">部門人才分佈分析</div>
      <canvas id="deptChart"></canvas>
    </div>
    <div class="report-card">
      <div style="font-weight:bold; margin-bottom:15px; border-left:4px solid var(--accent); padding-left:10px;">測驗分數質量分佈</div>
      <canvas id="scoreChart"></canvas>
    </div>
  </div>
</div>

<!-- 詳細資料視窗 -->
<div id="detailModal" class="modal"><div class="modal-content">
  <button class="close-btn" onclick="closeModal('detailModal')">✕</button>
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid var(--primary); padding-bottom:15px; margin-bottom:20px;">
    <h2 id="m-name" style="margin:0; color:var(--primary);">候選人詳情</h2>
    <div id="m-score-tag" class="badge" style="font-size:18px; padding:10px 20px;">0 分</div>
  </div>
  <div id="detail-loading" style="text-align:center; padding:40px;">讀取中...</div>
  <div id="detail-body" style="display:none;">
    <div style="font-size: 16px; color: var(--accent); font-weight: bold; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px;">基本資訊</div>
    <div class="detail-grid" id="profile-base"></div>
    <div style="font-size: 16px; color: var(--accent); font-weight: bold; border-bottom: 2px solid #eee; padding-bottom: 5px; margin: 25px 0 15px;">履歷詳情</div>
    <div class="detail-grid" id="profile-extra"></div>
    <div style="font-size: 16px; color: var(--accent); font-weight: bold; border-bottom: 2px solid #eee; padding-bottom: 5px; margin: 25px 0 15px;">數位簽署</div>
    <div style="text-align:center;"><img id="m-sig" style="max-width:320px; border:1px solid #eee; border-radius:8px;"></div>
  </div>
</div></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyQowSQ7CyUi44l5b3QXbkiEylN1TOeTUIxtirDOnbh1qbXH1YnZ3v0ylq2-kjsXQjxCQ/exec";
  let rawData = [], filteredData = [], currentPw = "";
  let deptChart, scoreChart;
  
  const pageSize = 201; 
  let currentPage = 1; 
  let currentSort = { key: 'originalIndex', dir: 'asc' };

  async function loadData() {
    currentPw = document.getElementById('pw').value;
    try {
      const res = await (await fetch(`${API_URL}?action=getResults&password=${encodeURIComponent(currentPw)}`)).json();
      if(res.success) {
        rawData = res.data.map((item, index) => ({ 
          ...item, 
          originalIndex: index + 1, 
          score: parseFloat(item.score) || 0,
          timestamp: String(item.timestamp).slice(0, 16) 
        }));
        document.getElementById('loginArea').style.display = 'none'; 
        document.getElementById('mainUI').style.display = 'block';
        
        const depts = [...new Set(rawData.map(r => r.dept))];
        document.getElementById('filterDept').innerHTML = '<option value="">所有需求單位</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
        const jobs = [...new Set(rawData.map(r => r.position))];
        document.getElementById('filterPos').innerHTML = '<option value="">所有應徵職務</option>' + jobs.map(j => `<option value="${j}">${j}</option>`).join('');
        
        handleSearch();
      } else alert("密碼錯誤");
    } catch(e) { alert("API 連線失敗"); }
  }

  function handleSearch() {
    const name = document.getElementById('searchName').value.toLowerCase();
    const dept = document.getElementById('filterDept').value;
    const pos = document.getElementById('filterPos').value;
    filteredData = rawData.filter(r => String(r.name).toLowerCase().includes(name) && (!dept || r.dept === dept) && (!pos || r.position === pos));
    currentPage = 1; 
    executeSort();
    updateDashboardStats();
  }

  function triggerSort(key) {
    if (currentSort.key === key) currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    else { currentSort.key = key; currentSort.dir = 'asc'; }
    executeSort();
  }

  function executeSort() {
    const dir = currentSort.dir === 'asc' ? 1 : -1;
    filteredData.sort((a, b) => {
      let vA = a[currentSort.key], vB = b[currentSort.key];
      if (typeof vA === 'number') return (vA - vB) * dir;
      if (currentSort.key === 'timestamp') return (new Date(vA) - new Date(vB)) * dir;
      return String(vA || "").localeCompare(String(vB || ""), 'zh-Hant') * dir;
    });
    ['originalIndex', 'name', 'dept', 'position', 'score', 'timestamp'].forEach(k => {
      const icon = document.getElementById(`icon-${k}`); if(!icon) return;
      icon.innerText = currentSort.key === k ? (currentSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
      icon.parentElement.classList.toggle('active-sort', currentSort.key === k);
    });
    renderTable();
  }

  function renderTable() {
    const start = (currentPage - 1) * pageSize; 
    const items = filteredData.slice(start, start + pageSize);
    document.getElementById('tbody').innerHTML = items.map(r => `
      <tr>
        <td>${r.originalIndex}</td>
        <td><strong>${r.name}</strong></td>
        <td>${r.dept}</td>
        <td>${r.position}</td>
        <td><span class="badge" style="background:${r.score >= 80 ? '#c6f6d5':'#ebf8ff'}; color:${r.score >= 80 ? '#22543d':'#2b6cb0'}">${r.score}</span></td>
        <td>${r.timestamp}</td>
        <td>
          <button onclick="viewProfile('${r.name}')" class="btn-nav" style="padding:4px 8px; font-size:11px;">詳情</button>
        </td>
      </tr>`).join('');

    const max = Math.ceil(filteredData.length / pageSize) || 1;
    document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${max} 頁 (共 ${filteredData.length} 筆)`;
    document.getElementById('prevPage').disabled = currentPage === 1; 
    document.getElementById('nextPage').disabled = currentPage === max;
  }

  function updateDashboardStats() {
    const data = filteredData;
    const total = data.length;
    document.getElementById('s-total').innerText = total;
    const avg = total ? (data.reduce((acc, c) => acc + c.score, 0) / total).toFixed(1) : 0;
    document.getElementById('s-avg').innerText = avg;
    const todayStr = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit'}).replace(/-/g, '/');
    const todayCount = data.filter(r => r.timestamp.startsWith(todayStr)).length;
    document.getElementById('s-today').innerText = todayCount;
    const maxScore = total ? Math.max(...data.map(r => r.score)) : 0;
    document.getElementById('s-max').innerText = maxScore;
    const passCount = data.filter(r => r.score >= 60).length;
    const passRate = total ? ((passCount / total) * 100).toFixed(1) : 0;
    document.getElementById('s-pass').innerText = passRate + "%";
    updateCharts(data);
  }

  function updateCharts(data) {
    const deptCounts = {};
    data.forEach(r => deptCounts[r.dept] = (deptCounts[r.dept] || 0) + 1);
    const scoreBins = {"0-20":0, "21-40":0, "41-60":0, "61-80":0, "81-100":0};
    data.forEach(r => {
      if(r.score <= 20) scoreBins["0-20"]++;
      else if(r.score <= 40) scoreBins["21-40"]++;
      else if(r.score <= 60) scoreBins["41-60"]++;
      else if(r.score <= 80) scoreBins["61-80"]++;
      else scoreBins["81-100"]++;
    });

    if(deptChart) deptChart.destroy();
    if(scoreChart) scoreChart.destroy();

    deptChart = new Chart(document.getElementById('deptChart'), {
      type: 'pie',
      data: { labels: Object.keys(deptCounts), datasets: [{ data: Object.values(deptCounts), backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b', '#858796'] }] },
      options: { responsive: true, maintainAspectRatio: false }
    });

    scoreChart = new Chart(document.getElementById('scoreChart'), {
      type: 'bar',
      data: { labels: Object.keys(scoreBins), datasets: [{ label: '人數', data: Object.values(scoreBins), backgroundColor: '#2b6cb0' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  }

  function changePage(offset) { currentPage += offset; renderTable(); window.scrollTo(0, 0); }

  async function viewProfile(name) {
    document.getElementById('detailModal').style.display = 'flex';
    document.getElementById('detail-loading').style.display = 'block';
    document.getElementById('detail-body').style.display = 'none';
    const res = await (await fetch(`${API_URL}?action=getFullCandidateInfo&password=${encodeURIComponent(currentPw)}&userName=${encodeURIComponent(name)}`)).json();
    if(res.success) {
      const d = res.data; const r = d.resumeArray;
      const fmtDate = (v) => v ? new Date(v).toLocaleDateString('zh-TW') : '---';
      document.getElementById('m-name').innerText = `候選人：${name}`;
      document.getElementById('m-score-tag').innerText = d.score + ' 分';
      document.getElementById('m-score-tag').style.background = d.score >= 80 ? '#c6f6d5':'#ebf8ff';
      document.getElementById('profile-base').innerHTML = `
        <div class="detail-item"><div class="detail-label">姓名</div><div class="detail-val">${r[1]}</div></div>
        <div class="detail-item"><div class="detail-label">性別</div><div class="detail-val">${r[2]}</div></div>
        <div class="detail-item"><div class="detail-label">出生日期</div><div class="detail-val">${fmtDate(r[3])}</div></div>
        <div class="detail-item"><div class="detail-label">聯絡電話</div><div class="detail-val">${r[4]}</div></div>
        <div class="detail-item"><div class="detail-label">電子郵件</div><div class="detail-val">${r[5]}</div></div>
        <div class="detail-item"><div class="detail-label">需求單位</div><div class="detail-val">${r[15]}</div></div>
        <div class="detail-item full-row"><div class="detail-label">通訊地址</div><div class="detail-val">${r[6]}</div></div>
      `;
      document.getElementById('profile-extra').innerHTML = `
        <div class="detail-item"><div class="detail-label">最高學歷</div><div class="detail-val">${r[7]}</div></div>
        <div class="detail-item"><div class="detail-label">畢業學校</div><div class="detail-val">${r[8]}</div></div>
        <div class="detail-item"><div class="detail-label">科系名稱</div><div class="detail-val">${r[9]}</div></div>
        <div class="detail-item"><div class="detail-label">工作年資</div><div class="detail-val">${r[10]} 年</div></div>
        <div class="detail-item"><div class="detail-label">應徵職務</div><div class="detail-val">${r[11]}</div></div>
        <div class="detail-item full-row"><div class="detail-label">工作經歷</div><div class="detail-val">${r[12]}</div></div>
        <div class="detail-item full-row"><div class="detail-label">專長技能</div><div class="detail-val">${r[13]}</div></div>
        <div class="detail-item full-row"><div class="detail-label">自我介紹</div><div class="detail-val">${r[14]}</div></div>
      `;
      document.getElementById('m-sig').src = d.signature || "";
      document.getElementById('detail-loading').style.display = 'none';
      document.getElementById('detail-body').style.display = 'block';
    }
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
