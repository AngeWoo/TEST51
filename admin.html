<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>招募數據決策中心 | Recruitment Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

    :root { 
      --primary: #991b1b; --accent: #ef4444; --bg: #f8fafc; 
      --card-border: #fee2e2; --shadow-3d: 0 10px 25px -5px rgba(153, 27, 27, 0.15);
      --btn-inset: inset 0 -4px 0 rgba(0,0,0,0.2);
    }

    * { box-sizing: border-box; }

    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; font-size: 16px; }
    .app-container { max-width: 1300px; margin: 0 auto; width: 100%; }

    /* --- 1. 登入面板 (加大版) --- */
    #loginArea { display: flex; justify-content: center; align-items: center; min-height: 85vh; width: 100%; }
    .login-card { 
      background: white; padding: 60px 45px; border-radius: 30px; 
      box-shadow: 0 30px 60px -12px rgba(153, 27, 27, 0.25); 
      width: 100%; max-width: 500px; text-align: center; border: 1px solid #fee2e2;
    }
    .login-card h2 { font-size: 38px; font-weight: 900; color: var(--primary); margin-bottom: 40px; }
    .login-card input { width: 100%; height: 75px; border: 2px solid #e2e8f0; border-radius: 20px; font-size: 24px; text-align: center; margin-bottom: 30px; padding: 0 20px; }
    .login-card button { width: 100%; height: 75px; background: var(--accent); color: white; border: none; border-radius: 20px; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #b91c1c; }

    /* --- 2. Header & 右上按鈕 --- */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; width: 100%; }
    .header h1 { font-size: 34px; font-weight: 900; color: var(--primary); margin: 0; }
    .nav-group { display: flex; gap: 10px; }
    .btn-3d { padding: 10px 24px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 16px; box-shadow: var(--btn-inset); position: relative; transition: 0.1s; white-space: nowrap; }
    .btn-red { background: var(--accent); color: white; }
    .btn-white { background: white; color: var(--primary); border: 1px solid #fee2e2; }

    /* --- 3. 統計卡片 (一列縮小版) --- */
    .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 25px; width: 100%; }
    .stat-card { padding: 20px 10px; border-radius: 18px; box-shadow: var(--shadow-3d); color: white; border-bottom: 5px solid rgba(0,0,0,0.15); text-align: center; }
    .c1 { background: linear-gradient(135deg, #ef4444, #991b1b); }
    .c2 { background: linear-gradient(135deg, #f97316, #c2410c); }
    .c3 { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
    .c4 { background: linear-gradient(135deg, #ec4899, #9d174d); }
    .c5 { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .stat-label { font-size: 13px; font-weight: 900; opacity: 0.95; white-space: nowrap; }
    .stat-value { font-size: 28px; font-weight: 900; margin-top: 5px; }

    /* --- 4. 搜尋工具列 --- */
    .search-box { background: white; padding: 20px; border-radius: 20px; margin-bottom: 25px; display: flex; gap: 15px; box-shadow: var(--shadow-3d); border: 1px solid #fee2e2; width: 100%; }
    .search-box input, .search-box select { height: 60px; padding: 0 20px; border: 2px solid #f1f5f9; border-radius: 15px; font-size: 18px; font-weight: 700; flex: 1; color: var(--primary); }

    /* --- 5. 表格區域 --- */
    .content-box { background: white; border-radius: 28px; box-shadow: var(--shadow-3d); overflow: hidden; border: 1px solid #fee2e2; width: 100%; margin-bottom: 25px; }
    .table-wrapper { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #fff5f5; padding: 15px; text-align: left; font-size: 15px; color: var(--primary); cursor: pointer; font-weight: 900; border-bottom: 2px solid #fee2e2; white-space: nowrap; }
    td { padding: 12px 15px; border-bottom: 1px solid #fff1f1; font-size: 16px; white-space: nowrap; }
    .badge-pass { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 8px; font-weight: 900; }
    .badge-fail { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 8px; font-weight: 900; }
    
    /* --- 6. 分頁控制 --- */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 30px; background: #fffafa; white-space: nowrap; width: 100%; }
    .page-btn { min-width: 45px; height: 45px; padding: 0 10px; border: 1px solid #eee; border-radius: 10px; background: white; font-weight: 800; cursor: pointer; font-size: 16px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1); transition: 0.1s; }
    .page-btn:active { transform: translateY(2px); box-shadow: none; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* --- 7. 報表分析 --- */
    .report-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; width: 100%; }
    .report-card { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow-3d); border: 1px solid #fee2e2; width: 100%; }
    .report-card h3 { font-size: 18px; font-weight: 900; color: var(--primary); margin: 0 0 15px 0; border-left: 5px solid var(--accent); padding-left: 10px; }

    /* --- 8. 手機版適配 --- */
    @media (max-width: 768px) {
      body { padding: 15px 10px; }
      .header { flex-direction: column; text-align: center; gap: 20px; }
      .header h1 { font-size: 26px; }
      .stat-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 20px; }
      .stat-card { padding: 10px 2px; border-radius: 10px; }
      .stat-label { font-size: 8px; }
      .stat-value { font-size: 14px; }
      .search-box { flex-direction: column; padding: 15px; border-radius: 18px; }
      .search-box input, .search-box select { height: 60px; font-size: 18px; }
      .report-section { grid-template-columns: 1fr; gap: 15px; }
      .pagination { gap: 5px; padding: 20px 5px; }
      .page-btn { min-width: 35px; height: 35px; font-size: 12px; }
    }

    /* Modal 視窗 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 40px; border-radius: 40px; width: 95%; max-width: 950px; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 25px; right: 25px; background: #f1f5f9; border: none; width: 55px; height: 55px; border-radius: 50%; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-header { padding-right: 70px; border-bottom: 4px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .detail-label { font-size: 12px; color: var(--primary); font-weight: 900; opacity: 0.6; margin-bottom: 3px; }
    .detail-val { font-size: 18px; font-weight: 700; color: #000; line-height: 1.3; }
    .json-box { background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 15px; font-family: monospace; white-space: pre-wrap; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="app-container">
  <div id="loginArea">
    <div class="login-card">
      <h2>管理系統授權驗證</h2>
      <input type="password" id="pw" placeholder="輸入管理密碼" onkeypress="if(event.keyCode==13) loadData()">
      <button onclick="loadData()">進入決策中心</button>
      <a href="index.html" style="display:block; margin-top:25px; color:var(--accent); text-decoration:none; font-weight:bold; font-size:18px;">返回應徵頁面</a>
    </div>
  </div>

  <div id="mainUI" style="display:none;">
    <div class="header">
      <div><h1>招募數據決策中心</h1></div>
      <div class="nav-group">
        <button class="btn-3d btn-white" onclick="location.href='index.html'">應徵首頁</button>
        <button class="btn-3d btn-red" onclick="location.reload()">登出系統</button>
      </div>
    </div>
    
    <div class="stat-grid">
      <div class="stat-card c1"><div class="stat-label">應徵人數</div><div id="s-total" class="stat-value">0</div></div>
      <div class="stat-card c2"><div class="stat-label">平均得分</div><div id="s-avg" class="stat-value">0</div></div>
      <div class="stat-card c3"><div class="stat-label">今日新增</div><div id="s-today" class="stat-value">0</div></div>
      <div class="stat-card c4"><div class="stat-label">最高分</div><div id="s-max" class="stat-value">0</div></div>
      <div class="stat-card c5"><div class="stat-label">及格率</div><div id="s-pass" class="stat-value">0%</div></div>
    </div>

    <div class="search-box">
      <input type="text" id="searchName" placeholder="🔍 搜尋候選人姓名..." oninput="handleSearch()">
      <select id="filterDept" onchange="handleSearch()"><option value="">所有單位</option></select>
      <select id="filterPos" onchange="handleSearch()"><option value="">所有職務</option></select>
    </div>

    <div class="content-box">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th onclick="triggerSort('originalIndex')">序號 <span id="icon-originalIndex"></span></th>
              <th onclick="triggerSort('name')">候選人姓名 <span id="icon-name"></span></th>
              <th onclick="triggerSort('dept')">需求單位 <span id="icon-dept"></span></th>
              <th onclick="triggerSort('position')">應徵職務 <span id="icon-position"></span></th>
              <th onclick="triggerSort('score')">分數 <span id="icon-score"></span></th>
              <th onclick="triggerSort('timestamp')">時間 <span id="icon-timestamp"></span></th>
              <th>管理操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="page-btn" id="firstPage" onclick="gotoPage(1)">«</button>
        <button class="page-btn" id="prevPage" onclick="changePage(-1)">‹</button>
        <span id="pageInfo" class="page-info" style="font-weight:900; color:var(--primary); font-size:16px; margin:0 10px;">第 1 頁</span>
        <button class="page-btn" id="nextPage" onclick="changePage(1)">›</button>
        <button class="page-btn" id="lastPage" onclick="gotoLastPage()">»</button>
      </div>
    </div>

    <div class="report-section">
      <div class="report-card"><h3>部門分佈分析</h3><div style="height:280px;"><canvas id="deptChart"></canvas></div></div>
      <div class="report-card"><h3>分數質量分析</h3><div style="height:280px;"><canvas id="scoreChart"></canvas></div></div>
    </div>
  </div>
</div>

<!-- 詳細視窗 -->
<div id="detailModal" class="modal"><div class="modal-content">
  <button class="close-btn" onclick="closeModal('detailModal')">✕</button>
  <div class="modal-header">
    <h2 id="m-name" style="margin:0; font-size:28px; color:var(--primary);">候選人詳情</h2>
    <div id="m-score-tag" style="background:#991b1b; color:white; padding:10px 25px; border-radius:15px; font-weight:900; font-size:24px;">0分</div>
  </div>
  <div id="detail-loading" style="text-align:center; padding:50px; font-size:20px; font-weight:bold;">數據讀取中...</div>
  <div id="detail-body" style="display:none;">
    <div id="profile-content" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;"></div>
    <div style="margin-top:40px; text-align:center; padding:40px; border:3px dashed #eee; border-radius:30px; background:#fafafa;">
      <p style="font-size:16px; color:var(--accent); font-weight:900; letter-spacing:2px; margin-bottom:20px;">DIGITAL SIGNATURE VERIFIED</p>
      <img id="m-sig" style="max-width:320px; width:100%; border-bottom:2px solid #333;">
    </div>
  </div>
</div></div>

<!-- JSON 匯入視窗 -->
<div id="jsonModal" class="modal"><div class="modal-content" style="max-width:650px;">
  <button class="close-btn" onclick="closeModal('jsonModal')">✕</button>
  <div class="modal-header"><h3>匯入 HR JSON 系統</h3></div>
  <div id="jsonDisplay" class="json-box"></div>
  <button class="btn-3d btn-red" style="width:100%; margin-top:25px; height:60px; font-size:18px;" onclick="copyJson()">一鍵複製 JSON</button>
</div></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyQowSQ7CyUi44l5b3QXbkiEylN1TOeTUIxtirDOnbh1qbXH1YnZ3v0ylq2-kjsXQjxCQ/exec";
  let rawData = [], filteredData = [], currentPw = "";
  let deptChart, scoreChart;
  const pageSize = 201; let currentPage = 1; let currentSort = { key: 'originalIndex', dir: 'asc' };

  const fmtTime = (s) => s ? String(s).slice(0, 16).replace('T', ' ') : '---';

  async function loadData() {
    currentPw = document.getElementById('pw').value;
    try {
      const res = await (await fetch(`${API_URL}?action=getResults&password=${encodeURIComponent(currentPw)}`)).json();
      if(res.success) {
        rawData = res.data.map((item, index) => ({ ...item, originalIndex: index + 1, score: parseFloat(item.score) || 0, timestamp: fmtTime(item.timestamp) }));
        document.getElementById('loginArea').style.display = 'none'; document.getElementById('mainUI').style.display = 'block';
        const depts = [...new Set(rawData.map(r => r.dept))];
        document.getElementById('filterDept').innerHTML = '<option value="">所有單位</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
        const jobs = [...new Set(rawData.map(r => r.position))];
        document.getElementById('filterPos').innerHTML = '<option value="">所有職務</option>' + jobs.map(j => `<option value="${j}">${j}</option>`).join('');
        handleSearch();
      } else alert("密碼錯誤");
    } catch(e) { alert("連線失敗"); }
  }

  function handleSearch() {
    const name = document.getElementById('searchName').value.toLowerCase();
    const dept = document.getElementById('filterDept').value;
    const pos = document.getElementById('filterPos').value;
    filteredData = rawData.filter(r => String(r.name).toLowerCase().includes(name) && (!dept || r.dept === dept) && (!pos || r.position === pos));
    currentPage = 1; executeSort(); updateDashboardStats();
  }

  function triggerSort(key) {
    if (currentSort.key === key) currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    else { currentSort.key = key; currentSort.dir = 'asc'; }
    executeSort();
  }

  function executeSort() {
    const dir = currentSort.dir === 'asc' ? 1 : -1;
    filteredData.sort((a, b) => {
      let vA = a[currentSort.key], vB = b[currentSort.key];
      if (typeof vA === 'number') return (vA - vB) * dir;
      return String(vA || "").localeCompare(String(vB || ""), 'zh-Hant') * dir;
    });
    ['originalIndex', 'name', 'dept', 'position', 'score', 'timestamp'].forEach(k => {
      const icon = document.getElementById(`icon-${k}`); if(!icon) return;
      icon.innerText = currentSort.key === k ? (currentSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    });
    renderTable();
  }

  function renderTable() {
    const start = (currentPage - 1) * pageSize; const items = filteredData.slice(start, start + pageSize);
    document.getElementById('tbody').innerHTML = items.map(r => `
      <tr><td>#${r.originalIndex}</td><td><strong>${r.name}</strong></td><td>${r.dept}</td><td>${r.position}</td>
        <td><span class="${r.score >= 60 ? 'badge-pass':'badge-fail'}">${r.score}</span></td><td>${r.timestamp}</td>
        <td><button onclick="viewProfile('${r.name}')" class="btn-3d btn-white" style="padding:6px 12px; font-size:12px; box-shadow:none; border:1px solid #ddd;">詳情</button>
            <button onclick="importHR('${r.name}')" class="btn-3d btn-red" style="padding:6px 12px; font-size:12px; box-shadow:none;">匯入</button></td>
      </tr>`).join('');
    
    const max = Math.ceil(filteredData.length / pageSize) || 1;
    document.getElementById('pageInfo').innerText = `PAGE ${currentPage} / ${max}`;
    document.getElementById('prevPage').disabled = currentPage === 1;
    document.getElementById('firstPage').disabled = currentPage === 1;
    document.getElementById('nextPage').disabled = currentPage === max;
    document.getElementById('lastPage').disabled = currentPage === max;
  }

  function changePage(offset) { currentPage += offset; renderTable(); window.scrollTo(0, 0); }
  function gotoPage(p) { currentPage = p; renderTable(); window.scrollTo(0, 0); }
  function gotoLastPage() { gotoPage(Math.ceil(filteredData.length / pageSize) || 1); }

  function updateDashboardStats() {
    const total = filteredData.length;
    document.getElementById('s-total').innerText = total;
    const avg = total ? (filteredData.reduce((acc, c) => acc + c.score, 0) / total).toFixed(1) : 0;
    document.getElementById('s-avg').innerText = avg;
    const todayStr = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit'}).replace(/-/g, '/');
    document.getElementById('s-today').innerText = filteredData.filter(r => r.timestamp.startsWith(todayStr)).length;
    document.getElementById('s-max').innerText = total ? Math.max(...filteredData.map(r => r.score)) : 0;
    const passRate = total ? ((filteredData.filter(r => r.score >= 60).length / total) * 100).toFixed(0) : 0;
    document.getElementById('s-pass').innerText = passRate + "%";
    updateCharts();
  }

  function updateCharts() {
    const deptCounts = {}; filteredData.forEach(r => deptCounts[r.dept] = (deptCounts[r.dept] || 0) + 1);
    const scoreBins = {"0-40":0, "41-60":0, "61-80":0, "81-100":0};
    filteredData.forEach(r => { if(r.score <= 40) scoreBins["0-40"]++; else if(r.score <= 60) scoreBins["41-60"]++; else if(r.score <= 80) scoreBins["61-80"]++; else scoreBins["81-100"]++; });
    if(deptChart) deptChart.destroy(); if(scoreChart) scoreChart.destroy();
    deptChart = new Chart(document.getElementById('deptChart'), { type: 'pie', data: { labels: Object.keys(deptCounts), datasets: [{ data: Object.values(deptCounts), backgroundColor: ['#991b1b', '#ef4444', '#f97316', '#8b5cf6', '#06b6d4'], borderWidth: 3, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
    scoreChart = new Chart(document.getElementById('scoreChart'), { type: 'bar', data: { labels: Object.keys(scoreBins), datasets: [{ label: '人數', data: Object.values(scoreBins), backgroundColor: '#991b1b', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false } });
  }

  async function viewProfile(name) {
    document.getElementById('detailModal').style.display = 'flex';
    document.getElementById('detail-loading').style.display = 'block';
    document.getElementById('detail-body').style.display = 'none';
    const res = await (await fetch(`${API_URL}?action=getFullCandidateInfo&password=${encodeURIComponent(currentPw)}&userName=${encodeURIComponent(name)}`)).json();
    if(res.success) {
      const d = res.data; const r = d.resumeArray;
      const fmtD = (v) => v ? new Date(v).toLocaleDateString('zh-TW') : '---';
      document.getElementById('m-score-tag').innerText = d.score + '分';
      const f = ["日期","姓名","性別","生日","電話","Email","地址","學歷","學校","科系","年資","職位","經歷","技能","自傳","單位"];
      document.getElementById('profile-content').innerHTML = r.map((val, idx) => `
        <div style="padding:10px; border-bottom:1px solid #eee; ${idx >= 12 && idx <= 14 || idx === 6 ? 'grid-column: span 2;' : ''}">
          <div style="font-size:12px; color:var(--primary); font-weight:900; opacity:0.6;">${f[idx] || "欄位"}</div>
          <div style="font-size:18px; font-weight:600;">${idx === 0 || idx === 3 ? fmtD(val) : (val || "---")}</div>
        </div>`).join('') + `<div style="padding:10px;"><div style="font-size:12px; color:var(--primary); font-weight:900; opacity:0.6;">考時</div><div style="font-size:18px; font-weight:600;">${fmtTime(d.timestamp)}</div></div>`;
      document.getElementById('m-sig').src = d.signature || "";
      document.getElementById('detail-loading').style.display = 'none';
      document.getElementById('detail-body').style.display = 'block';
    }
  }

  async function importHR(name) {
    document.getElementById('jsonModal').style.display = 'flex';
    const res = await (await fetch(`${API_URL}?action=getFullCandidateInfo&password=${encodeURIComponent(currentPw)}&userName=${encodeURIComponent(name)}`)).json();
    if(res.success) {
      const r = res.data.resumeArray;
      document.getElementById('jsonDisplay').innerHTML = `<pre style="color: #d4d4d4; font-size: 13px; margin:0; white-space: pre-wrap;">${JSON.stringify({ candidate: { name: r[1], gender: r[2], birthday: r[3], phone: r[4], email: r[5], edu: r[7], school: r[8], job: r[11], dept: r[15], exam_time: res.data.timestamp }, score: res.data.score }, null, 2)}</pre>`;
    }
  }

  function copyJson() { 
    const text = document.querySelector('#jsonDisplay pre').innerText;
    navigator.clipboard.writeText(text).then(() => alert("JSON 已複製到剪貼簿")); 
  }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
