<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數據決策中心 | Recruitment Analytics</title>
  <!-- 引入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

    :root { 
      --primary: #991b1b; --accent: #ef4444; --bg: #f8fafc; 
      --card-border: #fee2e2; --shadow-3d: 0 10px 25px -5px rgba(153, 27, 27, 0.15);
      --btn-inset: inset 0 -4px 0 rgba(0,0,0,0.2);
    }

    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); margin: 0; padding: 30px 20px; color: #1e293b; font-size: 16px; }
    .app-container { max-width: 1300px; margin: 0 auto; }

    /* --- 登入面板 --- */
    #loginArea { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
    .login-card { background: white; padding: 50px 40px; border-radius: 30px; box-shadow: 0 30px 60px -12px rgba(153, 27, 27, 0.25); width: 100%; max-width: 450px; text-align: center; border: 1px solid var(--card-border); }
    .login-card h2 { font-size: 32px; font-weight: 900; color: var(--primary); margin-bottom: 30px; }
    .login-card input { width: 100%; height: 60px; border: 2px solid #e2e8f0; border-radius: 15px; font-size: 18px; text-align: center; margin-bottom: 25px; box-sizing: border-box; }
    .login-card button { width: 100%; height: 60px; background: var(--accent); color: white; border: none; border-radius: 15px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #b91c1c; transition: 0.1s; }
    .login-card button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b91c1c; }

    /* --- Header & Nav --- */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
    .header h1 { font-size: 32px; font-weight: 900; color: var(--primary); margin: 0; }
    .nav-group { display: flex; gap: 12px; }
    .btn-3d { padding: 10px 24px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 15px; box-shadow: var(--btn-inset); position: relative; transition: 0.1s; }
    .btn-red { background: var(--accent); color: white; }
    .btn-red:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2); }
    .btn-white { background: white; color: var(--primary); border: 1px solid #fee2e2; }

    /* --- 統計卡片 --- */
    .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 35px; }
    .stat-card { padding: 25px 15px; border-radius: 20px; box-shadow: var(--shadow); color: white; border-bottom: 5px solid rgba(0,0,0,0.15); transition: 0.3s; text-align: center; }
    .c1 { background: linear-gradient(135deg, #ef4444, #991b1b); }
    .c2 { background: linear-gradient(135deg, #f97316, #c2410c); }
    .c3 { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
    .c4 { background: linear-gradient(135deg, #ec4899, #9d174d); }
    .c5 { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .stat-label { font-size: 12px; font-weight: 900; opacity: 0.9; text-transform: uppercase; }
    .stat-value { font-size: 32px; font-weight: 900; margin-top: 5px; }

    /* --- Search & Table --- */
    .search-box { background: white; padding: 20px; border-radius: 20px; margin-bottom: 25px; display: flex; gap: 15px; box-shadow: var(--shadow); border: 1px solid #fee2e2; }
    .search-box input, .search-box select { height: 50px; padding: 0 15px; border: 2px solid #f1f5f9; border-radius: 12px; font-size: 15px; font-weight: 600; flex: 1; }

    .content-box { background: white; border-radius: 25px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid #fee2e2; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #fff5f5; padding: 18px; text-align: left; font-size: 14px; color: var(--primary); cursor: pointer; font-weight: 900; border-bottom: 2px solid #fee2e2; }
    td { padding: 18px; border-bottom: 1px solid #fff1f1; font-size: 15px; }
    .badge-pass { background: #dcfce7; color: #166534; padding: 5px 12px; border-radius: 10px; font-weight: 900; }
    .badge-fail { background: #fee2e2; color: #991b1b; padding: 5px 12px; border-radius: 10px; font-weight: 900; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 25px; background: #fffafa; }

    /* --- Charts --- */
    .report-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .report-card { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid #fee2e2; }
    .report-card h3 { font-size: 16px; font-weight: 900; color: var(--primary); margin: 0 0 20px 0; border-left: 5px solid var(--accent); padding-left: 12px; }

    /* --- Modal 優化：詳情視窗文字縮小 --- */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 40px; border-radius: 30px; width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; position: relative; }
    
    .close-btn { position: absolute; top: 20px; right: 25px; background: #f1f5f9; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .close-btn:hover { background: var(--accent); color: white; }
    
    .modal-header { padding-right: 60px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 24px; margin: 0; }

    /* 詳情文字大小調整 */
    .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .detail-item { padding: 5px 0; }
    .detail-label { font-size: 13px; color: var(--primary); font-weight: 900; opacity: 0.6; margin-bottom: 3px; }
    .detail-val { font-size: 16px; font-weight: 600; color: #1e293b; line-height: 1.4; word-break: break-all; }
    .full-row { grid-column: 1 / -1; background: #f8fafc; padding: 15px; border-radius: 12px; }

    @media (max-width: 900px) {
      .header { flex-direction: column; text-align: center; gap: 20px; }
      .stat-grid { grid-template-columns: 1fr; }
      .report-section { grid-template-columns: 1fr; }
      .profile-grid { grid-template-columns: 1fr 1fr; }
      .detail-val { font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div id="loginArea">
    <div class="login-card">
      <h2>決策中心登入</h2>
      <input type="password" id="pw" placeholder="管理密碼" onkeypress="if(event.keyCode==13) loadData()">
      <button onclick="loadData()">授權進入</button>
      <a href="index.html" style="display:block; margin-top:20px; color:var(--accent); text-decoration:none; font-size:14px; font-weight:bold;">返回應徵頁面</a>
    </div>
  </div>

  <div id="mainUI" style="display:none;">
    <div class="header">
      <div><h1>招募數據決策中心</h1><p style="color:var(--accent); margin:5px 0 0; font-weight:700; font-size: 14px;">RECRUITMENT ANALYTICS</p></div>
      <div class="nav-group">
        <button class="btn-3d btn-white" onclick="location.href='index.html'">應徵首頁</button>
        <button class="btn-3d btn-red" onclick="location.reload()">登出系統</button>
      </div>
    </div>
    
    <div class="stat-grid">
      <div class="stat-card c1"><div class="stat-label">應徵總人數</div><div id="s-total" class="stat-value">0</div></div>
      <div class="stat-card c2"><div class="stat-label">平均測驗得分</div><div id="s-avg" class="stat-value">0</div></div>
      <div class="stat-card c3"><div class="stat-label">今日新增人數</div><div id="s-today" class="stat-value">0</div></div>
      <div class="stat-card c4"><div class="stat-label">測驗最高分</div><div id="s-max" class="stat-value">0</div></div>
      <div class="stat-card c5"><div class="stat-label">測驗及格率</div><div id="s-pass" class="stat-value">0%</div></div>
    </div>

    <div class="search-box">
      <input type="text" id="searchName" placeholder="🔍 搜尋候選人..." oninput="handleSearch()">
      <select id="filterDept" onchange="handleSearch()"><option value="">所有單位</option></select>
      <select id="filterPos" onchange="handleSearch()"><option value="">所有職務</option></select>
    </div>

    <div class="content-box">
      <table>
        <thead>
          <tr>
            <th onclick="triggerSort('originalIndex')">序號 <span id="icon-originalIndex"></span></th>
            <th onclick="triggerSort('name')">候選人姓名 <span id="icon-name"></span></th>
            <th onclick="triggerSort('dept')">需求單位 <span id="icon-dept"></span></th>
            <th onclick="triggerSort('position')">應徵職務 <span id="icon-position"></span></th>
            <th onclick="triggerSort('score')">分數 <span id="icon-score"></span></th>
            <th onclick="triggerSort('timestamp')">完成時間 <span id="icon-timestamp"></span></th>
            <th>功能操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pagination">
        <button class="btn-3d btn-white" id="prevPage" onclick="changePage(-1)">‹ 上一頁</button>
        <span id="pageInfo" style="font-weight:900; color:var(--primary); font-size:14px;">第 1 頁</span>
        <button class="btn-3d btn-white" id="nextPage" onclick="changePage(1)">下一頁 ›</button>
      </div>
    </div>

    <div class="report-section">
      <div class="report-card"><h3>部門人才分佈</h3><div style="height:300px;"><canvas id="deptChart"></canvas></div></div>
      <div class="report-card"><h3>分數質量分佈</h3><div style="height:300px;"><canvas id="scoreChart"></canvas></div></div>
    </div>
  </div>
</div>

<!-- 詳情視窗 -->
<div id="detailModal" class="modal"><div class="modal-content">
  <button class="close-btn" onclick="closeModal('detailModal')">✕</button>
  <div class="modal-header">
    <h2 id="m-name" style="color:var(--primary); font-weight:900;">載入中...</h2>
    <div id="m-score-tag" style="background:var(--primary); color:white; padding:8px 20px; border-radius:12px; font-weight:900; font-size:16px;">0分</div>
  </div>
  
  <div id="detail-loading" style="text-align:center; padding:50px; font-weight:bold; color:var(--accent);">正在讀取...</div>
  
  <div id="detail-body" style="display:none;">
    <div id="profile-content" class="profile-grid"></div>
    <div style="margin-top:30px; text-align:center; padding:30px; border:2px dashed #eee; border-radius:20px; background:#fafafa;">
      <p style="font-size:12px; color:var(--accent); font-weight:900; letter-spacing:2px; margin-bottom:15px;">AUTHENTICATED DIGITAL SIGNATURE</p>
      <img id="m-sig" style="max-width:320px; width:100%; border-bottom:2px solid #333;">
    </div>
  </div>
</div></div>

<!-- JSON 視窗 -->
<div id="jsonModal" class="modal"><div class="modal-content" style="max-width:650px;">
  <button class="close-btn" onclick="closeModal('jsonModal')">✕</button>
  <div class="modal-header"><h3>匯入 HR JSON 系統</h3></div>
  <div id="jsonDisplay" class="json-box"></div>
  <button class="btn-3d btn-red" style="width:100%; margin-top:20px; height:50px;" onclick="copyJson()">一鍵複製 JSON</button>
</div></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyQowSQ7CyUi44l5b3QXbkiEylN1TOeTUIxtirDOnbh1qbXH1YnZ3v0ylq2-kjsXQjxCQ/exec";
  let rawData = [], filteredData = [], currentPw = "";
  let deptChart, scoreChart;
  const pageSize = 201; let currentPage = 1; let currentSort = { key: 'originalIndex', dir: 'asc' };

  // 格式化時間小助手 (yyyy/mm/dd hh:mm)
  const fmtTime = (s) => {
    if(!s) return '---';
    const date = new Date(s);
    if(isNaN(date)) return String(s).slice(0, 16).replace('T', ' ');
    const pad = (n) => n.toString().padStart(2, '0');
    return `${date.getFullYear()}/${pad(date.getMonth()+1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
  };

  async function loadData() {
    currentPw = document.getElementById('pw').value;
    try {
      const res = await (await fetch(`${API_URL}?action=getResults&password=${encodeURIComponent(currentPw)}`)).json();
      if(res.success) {
        rawData = res.data.map((item, index) => ({ 
          ...item, originalIndex: index + 1, score: parseFloat(item.score) || 0, timestamp: fmtTime(item.timestamp) 
        }));
        document.getElementById('loginArea').style.display = 'none'; 
        document.getElementById('mainUI').style.display = 'block';
        const depts = [...new Set(rawData.map(r => r.dept))];
        document.getElementById('filterDept').innerHTML = '<option value="">所有單位</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
        const jobs = [...new Set(rawData.map(r => r.position))];
        document.getElementById('filterPos').innerHTML = '<option value="">所有職務</option>' + jobs.map(j => `<option value="${j}">${j}</option>`).join('');
        handleSearch();
      } else alert("密碼錯誤");
    } catch(e) { alert("連線失敗"); }
  }

  function handleSearch() {
    const name = document.getElementById('searchName').value.toLowerCase();
    const dept = document.getElementById('filterDept').value;
    const pos = document.getElementById('filterPos').value;
    filteredData = rawData.filter(r => String(r.name).toLowerCase().includes(name) && (!dept || r.dept === dept) && (!pos || r.position === pos));
    currentPage = 1; executeSort(); updateDashboardStats();
  }

  function triggerSort(key) {
    if (currentSort.key === key) currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    else { currentSort.key = key; currentSort.dir = 'asc'; }
    executeSort();
  }

  function executeSort() {
    const dir = currentSort.dir === 'asc' ? 1 : -1;
    filteredData.sort((a, b) => {
      let vA = a[currentSort.key], vB = b[currentSort.key];
      if (typeof vA === 'number') return (vA - vB) * dir;
      return String(vA || "").localeCompare(String(vB || ""), 'zh-Hant') * dir;
    });
    ['originalIndex', 'name', 'dept', 'position', 'score', 'timestamp'].forEach(k => {
      const icon = document.getElementById(`icon-${k}`); if(!icon) return;
      icon.innerText = currentSort.key === k ? (currentSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    });
    renderTable();
  }

  function renderTable() {
    const start = (currentPage - 1) * pageSize; const items = filteredData.slice(start, start + pageSize);
    document.getElementById('tbody').innerHTML = items.map(r => `
      <tr><td>#${r.originalIndex}</td><td><strong>${r.name}</strong></td><td>${r.dept}</td><td>${r.position}</td>
        <td><span class="${r.score >= 60 ? 'badge-pass':'badge-fail'}">${r.score}</span></td><td>${r.timestamp}</td>
        <td>
          <button onclick="viewProfile('${r.name}')" class="btn-3d btn-white" style="padding:5px 12px; font-size:12px; box-shadow:none; border:1px solid #ddd;">詳情</button>
          <button onclick="importHR('${r.name}')" class="btn-3d btn-red" style="padding:5px 12px; font-size:12px; box-shadow:none;">匯入</button>
        </td>
      </tr>`).join('');
    const max = Math.ceil(filteredData.length / pageSize) || 1;
    document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${max} 頁`;
    document.getElementById('prevPage').disabled = currentPage === 1; document.getElementById('nextPage').disabled = currentPage === max;
  }

  function updateDashboardStats() {
    const total = filteredData.length;
    document.getElementById('s-total').innerText = total;
    const avg = total ? (filteredData.reduce((acc, c) => acc + c.score, 0) / total).toFixed(1) : 0;
    document.getElementById('s-avg').innerText = avg;
    const todayStr = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit'}).replace(/-/g, '/');
    document.getElementById('s-today').innerText = filteredData.filter(r => r.timestamp.startsWith(todayStr)).length;
    document.getElementById('s-max').innerText = total ? Math.max(...filteredData.map(r => r.score)) : 0;
    const passRate = total ? ((filteredData.filter(r => r.score >= 60).length / total) * 100).toFixed(0) : 0;
    document.getElementById('s-pass').innerText = passRate + "%";
    updateCharts();
  }

  function updateCharts() {
    const deptCounts = {}; filteredData.forEach(r => deptCounts[r.dept] = (deptCounts[r.dept] || 0) + 1);
    const scoreBins = {"0-40":0, "41-60":0, "61-80":0, "81-100":0};
    filteredData.forEach(r => { if(r.score <= 40) scoreBins["0-40"]++; else if(r.score <= 60) scoreBins["41-60"]++; else if(r.score <= 80) scoreBins["61-80"]++; else scoreBins["81-100"]++; });
    if(deptChart) deptChart.destroy(); if(scoreChart) scoreChart.destroy();
    deptChart = new Chart(document.getElementById('deptChart'), { type: 'doughnut', data: { labels: Object.keys(deptCounts), datasets: [{ data: Object.values(deptCounts), backgroundColor: ['#991b1b', '#ef4444', '#f97316', '#8b5cf6', '#06b6d4'], borderWidth: 3, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 12 } } } } } });
    scoreChart = new Chart(document.getElementById('scoreChart'), { type: 'bar', data: { labels: Object.keys(scoreBins), datasets: [{ label: '人數', data: Object.values(scoreBins), backgroundColor: '#991b1b', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false } });
  }

  function changePage(offset) { currentPage += offset; renderTable(); window.scrollTo(0, 0); }

  async function viewProfile(name) {
    document.getElementById('detailModal').style.display = 'flex';
    document.getElementById('detail-loading').style.display = 'block';
    document.getElementById('detail-body').style.display = 'none';
    const res = await (await fetch(`${API_URL}?action=getFullCandidateInfo&password=${encodeURIComponent(currentPw)}&userName=${encodeURIComponent(name)}`)).json();
    if(res.success) {
      const d = res.data; const r = d.resumeArray;
      const fmtD = (v) => v ? new Date(v).toLocaleDateString('zh-TW') : '---';
      document.getElementById('m-name').innerText = r[1];
      document.getElementById('m-score-tag').innerText = d.score + '分';
      const f = ["提交日期","應徵姓名","性別","出生日期","聯絡電話","電子郵件","通訊地址","最高學歷","畢業學校","科系名稱","工作年資","應徵職務","工作經歷","專長技能","自我介紹","需求單位"];
      document.getElementById('profile-content').innerHTML = r.map((val, idx) => `
        <div class="detail-item ${idx >= 12 && idx <= 14 || idx === 6 ? 'full-row' : ''}">
          <div class="detail-label">${f[idx] || "欄位"}</div>
          <div class="detail-val">${idx === 0 || idx === 3 ? fmtD(val) : (val || "---")}</div>
        </div>`).join('') + `<div class="detail-item"><div class="detail-label">正式考試時間</div><div class="detail-val">${fmtTime(d.timestamp)}</div></div>`;
      document.getElementById('m-sig').src = d.signature || "";
      document.getElementById('detail-loading').style.display = 'none';
      document.getElementById('detail-body').style.display = 'block';
    }
  }

  async function importHR(name) {
    document.getElementById('jsonModal').style.display = 'flex';
    const res = await (await fetch(`${API_URL}?action=getFullCandidateInfo&password=${encodeURIComponent(currentPw)}&userName=${encodeURIComponent(name)}`)).json();
    if(res.success) {
      const r = res.data.resumeArray;
      const out = { candidate: { name: r[1], gender: r[2], birthday: r[3], phone: r[4], email: r[5], edu: r[7], school: r[8], job: r[11], dept: r[15], exam_time: res.data.timestamp }, score: res.data.score };
      document.getElementById('jsonDisplay').innerText = JSON.stringify(out, null, 2);
    }
  }

  function copyJson() { navigator.clipboard.writeText(document.getElementById('jsonDisplay').innerText).then(() => alert("JSON 已複製")); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
